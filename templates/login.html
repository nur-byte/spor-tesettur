{% extends "base.html" %}

{% block title %}Giriş Yap - Sporcu Hayat{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #780000 100%);
        color: #ffffff;
    }

    .login-container {
        background: rgba(15, 23, 42, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        margin: 60px auto;
        border-radius: 24px;
        padding: 40px 30px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #38bdf8;
        font-size: 1.8rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-size: 0.95rem;
    }

    .form-group input {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(30, 41, 59, 0.7);
        color: #ffffff;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .btn-giris {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #5b44ef 0%, #3b82f6 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .btn-giris:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    .alert-error {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid #ef4444;
        color: #fca5a5;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 0.9rem;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #94a3b8;
    }

    .register-link a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <h2>Sporcu Girişi 🚀</h2>

    {% if hata %}
        <div class="alert-error">{{ hata }}</div>
    {% endif %}

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" name="username" placeholder="Kullanıcı adınız" required>
        </div>
        <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-giris">Giriş Yap</button>
    </form>

    <div class="register-link">
        Hesabın yok mu? <a href="/register">Kayıt Ol</a>
    </div>
</div>
{% endblock %}
